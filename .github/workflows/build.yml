# DaevaTrack: build the whole solution and run the tests on every push and pull request.
name: build

on:
  push:
    branches: [main, daevatrack]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build AionMeter.sln -c Release
      - run: dotnet test tests/AionMeter.Tests -c Release --no-build
